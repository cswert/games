<!DOCTYPE html>
<html lang="en">
<!-- A classic game of bingo with squares themed around WikiHow articles.
		Choose a board size up to 10x10, and enter a custom list if desired
		Open the wikiHow articles by clicking the "Generate article" button
		Select a square to mark it with an X, auto win detection
		Hover over square for a description of the condition
	Vibe coded with Claude
	Created by cswert
	Last modified 8 Apr 2026-->
<head>
<meta charset=UTF-8>
<meta name=viewport content='width=device-width, initial-scale=1.0'>
<title>Wiki Bingo</title>
<style>
	body {font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background: #1a1a2e;
		color: #e0e0e0; padding: 2vmin; justify-items: center;}
	#vals {width: 98%; height: 80vmin; background: #16213e; color: #e0e0e0;
		border: 0.1vmin solid #0f3460; border-radius: 0.5em; padding: 1vmin;
		font-size: 2vmin; resize: none; text-wrap-mode: nowrap;}
	input[type=text] {background: #16213e; color: #e0e0e0; border: 0.1vmin solid #0f3460;
		border-radius: 0.4em; font-size: 2vmin; display: none;}
	input[type=number] {background: #16213e; color: #e0e0e0; border: 0.1vmin solid #0f3460;
		border-radius: 0.4em; padding: 0.5vmin 1vmin; font-size: 2vmin; width: 5vmin; text-align: center;}
	button {background: #0f3460; color: #e0e0e0; border: none; border-radius: 0.4em;
		padding: 0.5vmin 2vmin; font-size: 2vmin; cursor: pointer; margin: 2vmin 0.5vmin;}
	button:hover { background: #533483; }
	a {color: #e94560; text-decoration: none; margin-left: 1vmin; font-size: 2vmin;}
	a:hover { text-decoration: underline; }
	table {border-collapse: collapse; width: 95vmin; height: 0vmin; font-size: 2vmin; table-layout: fixed;}
	td {border: 0.1vmin solid #0f3460; cursor: pointer; position: relative; background: #16213e;
		color: #ccc; overflow: hidden; user-select: none; width: var(--size); height: var(--size);}
	td:hover {background: #1a1a40;}
	td.marked::after {content: '\2718'; position: absolute; top: 50%; left: 50%;
		transform: translate(calc(-50% + var(--rx, 0px)), calc(-50% + var(--ry, 0px))) rotate(var(--rr, 0deg));
		font-size: 15vmin; color: #e94560; opacity: 0.85; font-weight: bold;}
	table.win td {background: #1b4332; border-color: #2d6a4f;}
	.line {position: absolute; top: 0; left: 0; height: 95vmin; z-index: 1;
		background: darkgoldenrod; opacity: .6; border-radius: 50%; pointer-events: none;}
	#viewWrap {width: 95vmin; height: 95vmin; overflow: hidden; border: 0.1vmin solid #0f3460;
		border-radius: 0.5em; display: none;}
	#view {width: 135.714vmin; height: 190vmin; transform: scale(0.7); transform-origin: top left; border: none;}
	#sbs {display: inline-flex; gap: 1vmin; flex-wrap: wrap; justify-content: center; align-items: center; width: 100%;}
</style>
</head>
<body> 
	<textarea id=vals placeholder='Each line is a new entry use " | " to indicate hover'></textarea><br>
	<div style="display:inline-flex; align-items: center; gap: 1vmin;">
		<select onclick=mode(this) id=sss>
			<option>wikiHow</option>
			<option>wikipedia</option>
			<option>Fandom</option>
			<option>Minecraft</option>
			<option>Custom</option>
		</select>
		<input type=text id=comm value=terraria>
		<div id=sbsCheck style='display: none;'>Force SbS<input type=checkbox id=forceSbs></div>
		<input type=number id=bSize min=5 max=10 value=5>
		<button onclick=generateBoard()>Generate Board</button>
		<a id=link href='https://www.wikihow.com/Special:Randomizer' target=_blank>Random wiki page</a>
	</div>
	<br>
	<div id=sbs>
		<div id=viewWrap>
			<input type=range id=zoom min=30 max=100 value=64>
			<button id=rando>Randomize</button>
			<iframe id=view></iframe>
		</div><br>
		<div id=boardWrap style="position: relative;"><table id=board></table></div>
	</div>
</body>

		'Musical | Article is about any song/music from any game',
		'Why is this here? | Subject of article does not belong on the wiki',
		'End update? | Article is about anything "End" or "Ender"',
		'Marketplace | Article is about something on the Bedrock Marketplace',
		'Skins | A skin/skinpack is listed anywhere on the page',
		'/effect | Article is about any effect that can applied wih the /effect command',
		'Potions | Article is about brewing or any potion (not the effect)',
		'/enchant | Article is about enchanting or any enchantment',
		'Combat | Article focuses on something that could be used in combat',
		'Inventory Clutter | The item in the article contributes to the problem',
		'IDK | Something on the page is listed as ? or unknwon (eg introduced in version ?)',
		'Technical | Anything relating to the backend of the game (eg debug features)',
		'Pot | Article is about archeology, sherds, or the pot',
		'Dedicated Wam | Anything about a server or optimizing the game',
		'Structured | The article is about any structure',
		'Upgrades People | Article is about a netherite specific item',
		'Fun Fact | Ther is a trivia section in the article',
		'The Flattening | Block/Item was a number prior to the flatenning (1.13)',
		'Video Help | There is a video video included in the article',
		'Animated preview | The preview image on the side is animated',
		'Herobrine | Removed',
		'Events | Any IRL event or location for the game',
		'Merch | Article is about any official merchandise product',
		'Collaberation | Article is about any company that partnered with Mojang/Microsoft',
		'Vegitation | Article is about any plant/crop (exclude potato april fools)',
		'Protected Conent | The article is locked so only certain people can edit (has a lock in corner)',
		'Feautued Content | The article is listed as a featured article (has a nether star in corner)',
		'Latest Drop | Article is about content from the latest drop (game version)',
		'Youtube Famous | Article mentions a popular content creator by name/username',
		'Silence | A block or mob has no Sound section in the article',
		'Stick | A stick is used in, or a result of, the crafting recipe',
		'Common | Block/Item is listed as "Rarity [tier] Common"',
		'Uncommon | Block/Item is listed as "Rarity [tier] Uncommon"',
		'Rare | Block/Item is listed as "Rarity [tier] Rare"',
		'Epic | Block/Item is listed as "Rarity [tier] Epic"',
		'Legendary | Block/Item is listed as "Rarity [tier] Legendary/Unique"'
	];
	window.onload = () => {vals.value = wikiHow.join('\r\n');}
	comm.onchange = () => {
		if (sss.selectedIndex == 2) view.src = `https://${comm.value}.fandom.com/wiki/Special:Random`;
		else view.src = comm.value;
		if (comm.value.includes('https')) {
			sbsCheck.style.display = viewWrap.style.display = 'block';
			rando.onclick = () => {view.src = comm.value;};
		} else if (comm.value == '') sbsCheck.style.display = viewWrap.style.display = 'none';
	}
	zoom.oninput = () => {
		view.style.transform='scale('+zoom.value/100+')';
		view.style.width=view.style.height=(95/(zoom.value/100))+'vmin';
	}
	sbs.addEventListener('mouseenter', () => document.body.style.overflow = 'hidden');
	sbs.addEventListener('mouseleave', () => document.body.style.overflow = '');
	forceSbs.addEventListener('change', () => {
		if (forceSbs.checked) {
			document.documentElement.style.setProperty('--size', `${(75-bSize.value)/bSize.value}vmin`);
			board.style.height = board.style.width = '75vmin';
			sbs.style.flexWrap = 'nowrap';
		}
		else {
			document.documentElement.style.setProperty('--size', `${(95-bSize.value)/bSize.value/2}vmin`);
			board.style.height = board.style.width = '95vmin';
			sbs.style.flexWrap = 'wrap';
		}
	});
	function mode(e) {
		link.style.display = viewWrap.style.display = comm.style.display = 'none';
		if (e.selectedIndex == 0) {
			vals.value = wikiHow.join('\r\n');
			link.style.display = 'block';
			link.href = 'https://www.wikihow.com/Special:Randomizer';
		} else if (e.selectedIndex == 1) {
			vals.value = wikipedia.join('\r\n');
			sbsCheck.style.display = viewWrap.style.display = 'block';
			view.src = 'https://en.wikipedia.org/wiki/Special:Random';
			rando.onclick = () => {view.src = 'https://en.wikipedia.org/wiki/Special:Random';}
		} else if (e.selectedIndex == 2) {
			vals.value = fandom.join('\r\n');
			sbsCheck.style.display = viewWrap.style.display = comm.style.display = 'block';
			view.src = `https://${comm.value}.fandom.com/wiki/Special:Random`;
			rando.onclick = () => {view.src = `https://${comm.value}.fandom.com/wiki/Special:Random`;}
		} else if (e.selectedIndex == 3) {
			vals.value = minecraft.join('\r\n');
			link.style.display = 'block';
			link.href = `https://minecraft.wiki/w/Special:BlankPage/random`;
		} else {vals.value = ''; comm.style.display = 'block';}
	}
	let win = [];
	function generateBoard() {
		let squares = vals.value.split('\n');
		if (squares.length < +bSize.value * +bSize.value) {
			for (let i = squares.length; i < +bSize.value * +bSize.value; i++) {squares.push('Free Space');}
		}
		squares.sort(() => Math.random() - 0.5);
		board.style.height = board.style.width = '95vmin';
		board.classList.remove('win');
		document.documentElement.style.setProperty('--size', `${(95-bSize.value)/bSize.value}vmin`);
		let temp = ''; win = [];
		for (let i = 0; i < bSize.value; i++) {
			win.push([]);
			temp += '<tr>';
			for (let j = 0; j < bSize.value; j++) {
				win[i].push(0);
				temp += `<td id=${i+':'+j} onclick=toggle(this) 
					title="${(squares[0].split('|')[1]||'').replaceAll('"', '&quot;')}">
					${squares[0].split('|')[0]}</td>`;
				squares.shift();
			}
			temp += '</tr>';
		}
		board.innerHTML = temp;
		window.scrollTo(0,1000000);
	}
	function toggle(e) {
		if (e.classList.contains('marked')) {
			e.classList.remove('marked');
			win[e.id.split(':')[0]][e.id.split(':')[1]] = 0;
		} else {
			e.style.setProperty('--rx', (Math.random() * 5 - 2.5) + 'vmin');
			e.style.setProperty('--ry', (Math.random() * 5 - 2.5) + 'vmin');
			e.style.setProperty('--rr', (Math.random() * 60 - 30) + 'deg');
			e.classList.add('marked');
			win[e.id.split(':')[0]][e.id.split(':')[1]] = 1;
		}
		board.classList.remove('win');
		document.querySelectorAll('.line').forEach(e => e.remove());
		let d1 = 0, d2 = 0, temp = (95-bSize.value)/bSize.value;
		for (let i = 0; i < bSize.value; i++) {
			let rowSum = 0, colSum = 0;
			for (let j = 0; j < bSize.value; j++) {rowSum += win[i][j]; colSum += win[j][i];}
			d1 += win[i][i]; d2 += win[i][bSize.value - 1 - i];
			if (d1 == bSize.value) makeLine('d1');
			if (d2 == bSize.value) makeLine('d2');
			if (rowSum == bSize.value) makeLine('row');
			if (colSum == bSize.value) makeLine('col');
			function makeLine(e) {
				board.classList.add('win');
				let line = document.createElement('div');
				line.classList.add('line');
				line.style.width = `${temp/3}vmin`;
				if (e == 'd1' || e == 'd2') {
					line.style.transform = `rotate(${(e == 'd1' ? -1 : 1)*45+Math.random()*5-2.5}deg)`;
					line.style.height = '125vmin';
					line.style.top = `${47.5 - 63}vmin`;
					line.style.left = `${47.5 - temp/6}vmin`;
				} else if (e == 'row') {
					line.style.transform = `rotate(90deg)`;
					line.style.height = '95vmin';
					line.style.top = `${i*(temp+1) + temp/2 - 47.5 + Math.random()*.25-.125}vmin`;
					line.style.left = `${47.5 - temp/6}vmin`;
				} else line.style.left = `${i*temp + temp/3 + i + Math.random()*.25-.125}vmin`;
				boardWrap.appendChild(line);
			}
		}
	}
</script>
